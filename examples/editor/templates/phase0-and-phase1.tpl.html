<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{$title}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div id="{$containerId}"></div>
<script>
    window.__THORM_DEV__ = true;
</script>
<script type="module">
    import { mount } from '/runtime/index.js';

    const RT = (async function () {
        const res = await fetch('{$iruri_dir}{$iruri}', { cache: 'no-store' });
        const ir = await res.json();
        const x = mount(ir, document.getElementById('app'));
        const atoms = x?.core?.store?.atoms;
        const subs = x?.core?.store?.subs;
        const notify = typeof x?.core?.store?.notify === 'function'
            ? x.core.store.notify.bind(x.core.store)
            : (typeof x?.core?.notify === 'function'
                ? x.core.notify.bind(x.core)
                : null)
        return {
            atoms:  atoms ?? null,
            subs:   subs  ?? null,
            notify: notify
        };
    })();
    RT.then(result => {
        window.__THORM_RUNTIME__ = result;
        import('/runtime/devtools/devtools.js');
        return result;
    });

    // Initialize the JS editor
    window.addEventListener('DOMContentLoaded', () => {
        const state = window.editorState;
        const queue = [];

        document.querySelectorAll('[data-block-id]').forEach(el => {
            el.addEventListener('input', () => {
                const blockId = el.dataset.blockId;
                // In a full implementation, extract IR from DOM and compute diff
                // For now, we just queue a placeholder
                queue.push({
                    blockId: blockId,
                    type: 'text-edit',
                    timestamp: Date.now()
                });
            });
        });

        // Periodic sync (every 60 seconds)
        setInterval(() => {
            if (queue.length > 0) {
                fetch('/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(queue),
                }).then(res => {
                    if (res.ok) {
                        queue = [];
                    }
                }).catch(err => {
                    console.error('Save failed:', err);
                });
            }
        }, 60000);
    });
</script>
</body>
</html>
